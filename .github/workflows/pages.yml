name: Publicar calculadora de cierre MSF

on:
  push:
    branches: [main]
    paths:
      - 'site-source.html.gz.b64'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar HTML
        run: |
          mkdir -p public
          base64 --decode site-source.html.gz.b64 | gzip -dc > public/index.html
          test -s public/index.html
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
